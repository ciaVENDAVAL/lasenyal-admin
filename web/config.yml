# Sveltia CMS config for lasenyal-web — generated by scripts/make_config.py — edit that script, not this file.
# Docs: https://sveltiacms.app/en/docs
app_title: La Senyal · web
logo:
  src: /lasenyal-admin/logo.png
backend:
  name: github
  repo: ciaVENDAVAL/lasenyal-web
  branch: main
  auth_methods:
  - token
  commit_messages:
    create: 'Admin: create {{collection}} “{{slug}}”'
    update: 'Admin: update {{collection}} “{{slug}}”'
    delete: 'Admin: delete {{collection}} “{{slug}}”'
    uploadMedia: 'Admin: upload “{{path}}”'
    deleteMedia: 'Admin: delete “{{path}}”'
site_url: https://ciavendaval.github.io/lasenyal-web/
media_folder: assets/img/lg
public_folder: /assets/img/lg
media_libraries:
  default:
    config:
      slugify_filename: false
      max_file_size: 25000000
slug:
  encoding: ascii
  clean_accents: true
editor:
  preview: false
output:
  yaml:
    quote: double
  omit_empty_optional_fields: true
i18n:
  structure: multiple_folders
  locales:
  - ca
  - es
  - en
  default_locale: ca
asset_collections:
- name: pdfs
  label: PDFs
  media_folder: pdf
  public_folder: /pdf
  icon: picture_as_pdf
- name: photos
  label: Photos (full size)
  media_folder: assets/img/lg
  public_folder: /assets/img/lg
  icon: photo_library
- name: member_photos
  label: Member photos
  media_folder: assets/img/members
  public_folder: /assets/img/members
  icon: account_circle
singletons:
- name: downloads
  label: 'PDFs: which one the links give'
  icon: picture_as_pdf
  file: _data/downloads.yml
  fields:
  - name: presskit
    label: Press kit
    widget: object
    hint: 'Short links for emails: lasenyal.com/dossier/ca/ · /es/ · /en/ — they always give the PDF chosen here. To publish a new version: upload it here (name it LaSenyal_CA_presskit_2026-12.pdf) and
      choose it, or upload one with exactly the same name as the old one and choose Replace.'
    fields:
    - name: ca
      label: Català
      widget: file
      media_folder: /pdf
      public_folder: /pdf
    - name: es
      label: Castellano
      widget: file
      media_folder: /pdf
      public_folder: /pdf
    - name: en
      label: English
      widget: file
      media_folder: /pdf
      public_folder: /pdf
- name: site
  label: 'Site settings: contact, footer, main photos'
  icon: tune
  file: _data/site.yml
  fields:
  - name: contact
    label: Contact
    widget: object
    fields:
    - name: email
      label: Email
      widget: string
    - name: phones
      label: Phones
      widget: list
    - name: instagram
      label: Instagram link
      widget: string
    - name: video
      label: YouTube video link
      widget: string
      hint: Shown on the home page. A normal link like https://www.youtube.com/watch?v=…
  - name: footer_text
    label: Footer line
    widget: string
    hint: The year is added at the end automatically.
  - name: images
    label: Main photos
    widget: object
    fields:
    - name: hero
      label: Home · big top photo (wide screens)
      widget: image
      media_folder: /assets/img/lg
      public_folder: /assets/img/lg
      required: true
      hint: Landscape photo.
    - name: hero_mobile
      label: Home · big top photo (phones)
      widget: image
      media_folder: /assets/img/lg
      public_folder: /assets/img/lg
      required: true
      hint: Portrait photo.
    - name: video_cover
      label: Home · video cover (before it plays)
      widget: image
      media_folder: /assets/img/lg
      public_folder: /assets/img/lg
      required: true
    - name: intro
      label: Home · photo next to the intro
      widget: image
      media_folder: /assets/img/lg
      public_folder: /assets/img/lg
      required: true
    - name: band
      label: Members page photo (also used when the site is shared)
      widget: image
      media_folder: /assets/img/lg
      public_folder: /assets/img/lg
      required: true
- name: menu
  label: Menu
  icon: menu
  file: _data/menu.yml
  fields:
  - name: header
    label: Top bar (wide screens)
    hint: Drag to reorder.
    widget: list
    types: &id001
    - name: builtin
      label: Built-in page
      widget: object
      summary: '{{fields.key}}'
      fields:
      - name: key
        label: Page
        widget: select
        options:
        - label: Home
          value: home
        - label: Members
          value: members
        - label: Concerts
          value: concerts
        - label: Hands game
          value: hands
        - label: Contact (jumps to the footer)
          value: contact
    - name: page
      label: Page from 'Pages'
      widget: object
      summary: '{{fields.page}}'
      fields:
      - name: page
        label: Page
        widget: relation
        collection: pages
        value_field: '{{slug}}'
        display_fields:
        - title
      - name: label
        label: Menu name (optional)
        widget: string
        required: false
        hint: Leave empty to use the page title. The same name is used in every language.
  - name: menu
    label: Full menu (☰ button)
    widget: list
    types: *id001
- name: theme
  label: 'Look: colours and font'
  icon: palette
  file: _data/theme.yml
  fields:
  - name: background
    label: Background
    widget: color
    default: '#0c0404'
  - name: surface
    label: Cards and borders
    widget: color
    default: '#171211'
  - name: headings
    label: Titles
    widget: color
    default: '#ffffff'
  - name: accent
    label: Accent (links, pink)
    widget: color
    default: '#e675b5'
  - name: box
    label: Upcoming-concerts box (green)
    widget: color
    default: '#0a733b'
  - name: body_font
    label: Text font
    widget: select
    default: Questrial
    options:
    - Questrial
    - Inter
    - Work Sans
    - DM Sans
    - Space Grotesk
    - IBM Plex Sans
    hint: Titles keep the wide ARCHIVO font. The accessibility button's 'easier font' still works.
