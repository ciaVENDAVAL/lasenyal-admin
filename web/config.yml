- name: concerts
  label: Concerts
  icon: event
  files:
  - name: list
    label: Concert list
    file: _data/concerts.yml
    fields:
    - name: concerts
      label: Concerts
      widget: list
      root: true
      add_to_top: true
      collapsed: true
      summary: '{{fields.date}} · {{fields.venue}}'
      label_singular: concert
      hint: Newest at the top. Concerts move to 'past' by themselves the day after.
      fields:
      - name: date
        label: Date
        widget: datetime
        type: date
        format: YYYY-MM-DD
      - name: venue
        label: Venue
        widget: string
      - name: place
        label: Neighbourhood, city
        widget: string
      - name: time
        label: Time (optional)
        widget: string
        required: false
        hint: e.g. 21:00
      - name: map
        label: Google Maps link (optional)
        widget: string
        required: false
      - name: link
        label: Tickets / event link (optional)
        widget: string
        required: false
      - name: residency
        label: Superlunes (weekly residency)
        widget: boolean
        default: false
        required: false
      - name: end
        label: Last Monday (Superlunes only)
        widget: datetime
        type: date
        format: YYYY-MM-DD
        required: false
      - name: label
        label: Show this instead of the dates (optional)
        widget: string
        required: false
        hint: e.g. 2024, if you only know the year.
      - name: photo
        label: Photo (Superlunes, optional)
        widget: image
        media_folder: /assets/img/lg
        public_folder: /assets/img/lg
        required: false
- name: members
  label: Members
  icon: groups
  files:
  - name: list
    label: Members
    file: _data/members.yml
    fields:
    - name: members
      label: Members
      widget: list
      root: true
      collapsed: true
      summary: '{{fields.name}}'
      label_singular: member
      thumbnail: photo
      hint: Drag to change the order.
      fields:
      - name: name
        label: Name
        widget: string
      - name: role
        label: Role
        widget: select
        options:
        - label: Percussió i direcció
          value: perc_dir
        - label: Bombardí i direcció
          value: euph_dir
        - label: Percussió
          value: perc
        - label: Saxo tenor
          value: tenor
        - label: Saxo alt
          value: alto
        - label: Saxo baríton
          value: bari
        - label: Trompeta
          value: trumpet
        hint: The role names are in Texts → Member roles.
      - name: photo
        label: Photo
        widget: image
        media_folder: /assets/img/members
        public_folder: /assets/img/members
        required: true
        hint: It is cropped square (500 × 500) automatically.
      - name: instagram
        label: Instagram link (optional)
        widget: string
        required: false
- name: gallery
  label: Photo strip (home)
  icon: photo_library
  files:
  - name: list
    label: Photo strip
    file: _data/gallery.yml
    fields:
    - name: photos
